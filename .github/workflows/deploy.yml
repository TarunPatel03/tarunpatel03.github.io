name: Deploy Vite site to GitHub Pages
on:
  push:
    branches: [main-v2]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the legacy Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            status=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --limit 10 --json name,status --jq '[.[] | select(.name == "pages build and deployment")][0].status // ""')
            if [ "$status" = "completed" ]; then
              echo "Legacy Pages deployment completed."
              exit 0
            fi
            echo "Waiting for legacy Pages deployment (attempt $attempt/60, status: ${status:-not-found})"
            sleep 5
          done
          echo "Timed out waiting for the legacy Pages deployment."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
